<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام التحكم بالكلب الروبوتي</title>
<!-- استدعاء خط Cairo الاحترافي وأيقونات FontAwesome -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --accent-blue: #38bdf8;
    --accent-blue-hover: #0284c7;
    --accent-red: #ef4444;
    --accent-red-hover: #dc2626;
    --accent-green: #10b981;
    --accent-green-hover: #059669;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
  }

  body {
    background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .dashboard-container {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .header {
    text-align: center;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .header p {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* شبكة التحكم بالاتجاهات */
  .control-pad {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
    gap: 15px;
    direction: ltr;
    margin: 10px 0;
  }

  .btn {
    border: none;
    border-radius: 18px;
    background: #1e293b;
    color: var(--accent-blue);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .btn span {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn:hover {
    transform: translateY(-3px);
    background: #334155;
    box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.2);
    color: #ffffff;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn.stop {
    color: var(--accent-red);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .btn.stop:hover {
    background: var(--accent-red);
    color: #ffffff;
    box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
  }

  .forward  { grid-column: 2; grid-row: 1; }
  .left     { grid-column: 1; grid-row: 2; }
  .stop     { grid-column: 2; grid-row: 2; }
  .right    { grid-column: 3; grid-row: 2; }
  .backward { grid-column: 2; grid-row: 3; }

  /* قسم الصوت */
  .voice-card {
    width: 100%;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .voice-btn {
    background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-green-hover) 100%);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    transition: all 0.2s ease;
  }

  .voice-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
  }

  .voice-btn.listening {
    animation: pulse 1.5s infinite;
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  #voiceOutput {
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 20px;
  }

  /* شريط الحالة والرسائل */
  .status-badge {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
    padding: 12px 16px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-blue);
    border: 1px solid rgba(56, 189, 248, 0.2);
  }
</style>
</head>
<body>

  <div class="dashboard-container">
    <div class="header">
      <h1>لوحة تحكم الكلب الروبوتي 🤖🐶</h1>
      <p>التحكم بالأوامر باللمس والصوت عبر الإنترنت</p>
    </div>

    <!-- شبكة التحكم -->
    <div class="control-pad">
      <button class="btn forward" onclick="sendCommand('forward')">
        <i class="fa-solid fa-chevron-up"></i>
        <span>forward</span>
      </button>
      <button class="btn left" onclick="sendCommand('left')">
        <i class="fa-solid fa-chevron-left"></i>
        <span>left</span>
      </button>
      <button class="btn stop" onclick="sendCommand('stop')">
        <i class="fa-solid fa-hand"></i>
        <span>stop</span>
      </button>
      <button class="btn right" onclick="sendCommand('right')">
        <i class="fa-solid fa-chevron-right"></i>
        <span>right</span>
      </button>
      <button class="btn backward" onclick="sendCommand('backward')">
        <i class="fa-solid fa-chevron-down"></i>
        <span>backward</span>
      </button>
    </div>

    <!-- قسم الصوت الاحترافي -->
    <div class="voice-card">
      <button id="voiceBtn" class="voice-btn" onclick="startVoice()">
        <i class="fa-solid fa-microphone"></i>
        <span>اضغط للتحدث بالصوت</span>
      </button>
      <div id="voiceOutput">جاهز للاستماع...</div>
    </div>

    <!-- شريط حالة السيرفر -->
    <div id="status" class="status-badge">النظام متصل وجاهز الاستجابة</div>
  </div>

  <script>
    function sendCommand(cmd) {
      const statusElem = document.getElementById('status');
      statusElem.innerText = 'جاري إرسال الأمر...';
      statusElem.style.color = '#f59e0b';
      statusElem.style.borderColor = 'rgba(245, 158, 11, 0.3)';

      fetch('update_command.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'command=' + encodeURIComponent(cmd)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          statusElem.innerText = 'تم التحديث بنجاح: ' + data.button + ' (' + data.stored_as + ')';
          statusElem.style.color = '#10b981';
          statusElem.style.borderColor = 'rgba(16, 185, 129, 0.3)';
        } else {
          statusElem.innerText = 'خطأ: ' + data.message;
          statusElem.style.color = '#ef4444';
          statusElem.style.borderColor = 'rgba(239, 68, 68, 0.3)';
        }
      })
      .catch(err => {
        statusElem.innerText = 'فشل الاتصال بالسيرفر';
        statusElem.style.color = '#ef4444';
      });
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("المتصفح لا يدعم الصوت، يفضل استخدام Chrome");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      const voiceBtn = document.getElementById('voiceBtn');
      const voiceOutput = document.getElementById('voiceOutput');

      voiceBtn.classList.add('listening');
      voiceOutput.innerText = "جاري الاستماع لصوتك...";

      recognition.onresult = function(event) {
        voiceBtn.classList.remove('listening');
        let command = event.results[0][0].transcript.toLowerCase().trim();
        voiceOutput.innerText = 'سمعتك تقول: "' + command + '"';

        if (command.includes("forward")) {
          sendCommand("forward");
        } else if (command.includes("backward") || command.includes("back")) {
          sendCommand("backward");
        } else if (command.includes("left")) {
          sendCommand("left");
        } else if (command.includes("right")) {
          sendCommand("right");
        } else if (command.includes("stop")) {
          sendCommand("stop");
        } else {
          voiceOutput.innerText += " (أمر غير معروف)";
        }
      };

      recognition.onerror = function(event) {
        voiceBtn.classList.remove('listening');
        voiceOutput.innerText = "حدث خطأ: " + event.error;
      };

      recognition.onend = function() {
        voiceBtn.classList.remove('listening');
      };

      recognition.start();
    }
  </script>

</body>
</html>
